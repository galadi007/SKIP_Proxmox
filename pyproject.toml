[tool.uv.sources]
skip-api = { workspace = true }
capability-operator = { workspace = true }
skip-capability-sdk = { workspace = true }
skip-capability-litellm = { workspace = true }

[tool.uv.workspace]
members = [
    "apps/skip-api",
    "apps/capability-operator",
    "packages/skip-capability-sdk",
    "plugins/capabilities/*",
]
exclude = []


[dependency-groups]
docs = [
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings[python]",
]
dev = [
  "httpx",
  "pytest",
  "ruff",
]

[tool.pytest.ini_options]
pythonpath = [
  "apps/skip-api",
]

