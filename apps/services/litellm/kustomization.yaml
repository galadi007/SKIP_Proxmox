apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: litellm

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: litellm-config
    files:
      - config.yaml

generatorOptions:
  labels:
    app.kubernetes.io/name: litellm
