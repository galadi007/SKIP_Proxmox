apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: minio

  ports:
    - name: api
      protocol: TCP
      port: 9000
      targetPort: api
    - name: console
      protocol: TCP
      port: 9001
      targetPort: console
