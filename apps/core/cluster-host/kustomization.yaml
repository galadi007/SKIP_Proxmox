apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Stellt dieselbe zentrale Konfiguration für die getrennt gerenderten
# ArgoCD- und Harbor-Kustomizations bereit.
configMapGenerator:
  - name: skip-cluster-settings
    envs:
      - skip-settings.conf

generatorOptions:
  disableNameSuffixHash: true
