apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: harbor
  namespace: kube-system   # HelmChart CRD muss in kube-system liegen
spec:
  repo: https://helm.goharbor.io
  chart: harbor
  targetNamespace: harbor
  version: "1.16.0"        # Harbor v2.11.x
  valuesContent: |-
    # --- Externe URL ---
    externalURL: https://harbor.192-168-0-165.sslip.io:30443

    # --- Ingress ---
    expose:
      type: clusterIP
      tls:
        enabled: false

    # --- Admin-Passwort ---
    # Beim ersten Login ändern!
    harborAdminPassword: "Harbor12345"

    # --- Persistenter Storage ---
    persistence:
      enabled: true
      resourcePolicy: keep
      persistentVolumeClaim:
        registry:
          storageClass: local-path
          size: 20Gi
        jobservice:
          jobLog:
            storageClass: local-path
            size: 1Gi
        database:
          storageClass: local-path
          size: 1Gi
        redis:
          storageClass: local-path
          size: 1Gi
        trivy:
          storageClass: local-path
          size: 5Gi

    # --- Ressourcen ---
    core:
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
        limits:
          memory: 512Mi
          cpu: 500m

    registry:
      relativeurls: true    # Fix: Push-Traffic korrekt via Traefik routen
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
        limits:
          memory: 512Mi
          cpu: 500m

    database:
      internal:
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m

    redis:
      internal:
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 256Mi
            cpu: 250m

    trivy:
      enabled: true
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
        limits:
          memory: 512Mi
          cpu: 500m

  logs:
    general:
      level: INFO
    access:
      enabled: true
