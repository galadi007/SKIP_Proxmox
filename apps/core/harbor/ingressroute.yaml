apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: harbor
  namespace: harbor
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`harbor.192-168-0-165.sslip.io`) && PathPrefix(`/api/`)
      kind: Rule
      priority: 100
      services:
        - name: harbor-core
          port: 80
    - match: Host(`harbor.192-168-0-165.sslip.io`) && PathPrefix(`/service/`)
      kind: Rule
      priority: 100
      services:
        - name: harbor-core
          port: 80
    - match: Host(`harbor.192-168-0-165.sslip.io`) && PathPrefix(`/v2/`)
      kind: Rule
      priority: 100
      services:
        - name: harbor-core
          port: 80
    - match: Host(`harbor.192-168-0-165.sslip.io`) && PathPrefix(`/c/`)
      kind: Rule
      priority: 100
      services:
        - name: harbor-core
          port: 80
    - match: Host(`harbor.192-168-0-165.sslip.io`)
      kind: Rule
      priority: 10
      services:
        - name: harbor-portal
          port: 80
  tls: {}