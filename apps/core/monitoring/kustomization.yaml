apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../cluster-host
  - namespace.yaml
  - grafana-admin-sealedsecret.yaml
  - helmrelease.yaml
  - ingressroute.yaml

configMapGenerator:
  - name: grafana-dashboard-skip-overview
    namespace: monitoring
    files:
      - skip-overview.json
    options:
      labels:
        grafana_dashboard: "1"

vars:
  - name: SKIP_SERVER_IP
    objref:
      apiVersion: v1
      kind: ConfigMap
      name: skip-cluster-settings
    fieldref:
      fieldpath: data.SKIP_SERVER_IP

configurations:
  - varreference.yaml
