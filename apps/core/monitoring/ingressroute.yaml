apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`grafana.$(SKIP_SERVER_IP).sslip.io`)
      services:
        - name: grafana
          port: 80
  tls: {}
