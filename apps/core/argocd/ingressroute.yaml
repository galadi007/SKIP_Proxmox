apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - kind: Rule
      match: Host(`argocd.$(SKIP_SERVER_IP).sslip.io`)
      services:
        - name: argocd-server
          port: 80
  tls: {}
