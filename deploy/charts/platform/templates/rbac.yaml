apiVersion: v1
kind: ServiceAccount
metadata:
  name: skip-api
---
# First stage: catalog/login only. No application writes until KRO is restored.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: skip-api-read
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, services, persistentvolumeclaims]
    verbs: [get, list]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list]
  - apiGroups: [kro.run]
    resources: [applications]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: skip-api-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: skip-api-read
subjects:
  - kind: ServiceAccount
    name: skip-api
    namespace: {{ .Release.Namespace }}
