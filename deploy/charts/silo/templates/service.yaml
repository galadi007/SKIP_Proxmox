apiVersion: v1
kind: Service
metadata:
  name: silo
  labels:
    app.kubernetes.io/name: silo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: silo
  ports:
    - name: api
      protocol: TCP
      port: 9000
      targetPort: api
    - name: console
      protocol: TCP
      port: 9001
      targetPort: console
