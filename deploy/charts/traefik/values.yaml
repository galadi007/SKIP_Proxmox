# Ingress-Controller der Plattform. k3s wird mit "--disable traefik"
# installiert (bootstrap/ansible/site.yml), daher kommt Traefik samt CRDs
# (IngressRoute) von hier.
traefik:
  deployment:
    replicas: 1

  service:
    type: NodePort

  ports:
    web:
      nodePort: 30080     # HTTP
    websecure:
      nodePort: 30443     # HTTPS

  ingressRoute:
    dashboard:
      enabled: true

  logs:
    general:
      level: INFO

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
