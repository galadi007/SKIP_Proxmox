apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:galadi007/SKIP_Proxmox.git
    targetRevision: main
    path: deploy/charts/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-system
  # Deliberately manual: prepare secrets and select a built image first.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
