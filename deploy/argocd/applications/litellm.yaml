apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:galadi007/SKIP_Proxmox.git
    targetRevision: main
    path: deploy/charts/litellm
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: litellm
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
