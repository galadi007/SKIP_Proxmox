# Lokaler Testcluster fuer die Charts unter deploy/charts.
# Anlegen/Installieren: make local-up, Entfernen: make local-down
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: skip-local
servers: 1
agents: 0
ports:
  - port: 127.0.0.1:8080:80
    nodeFilters:
      - loadbalancer
  - port: 127.0.0.1:8443:443
    nodeFilters:
      - loadbalancer
options:
  k3s:
    extraArgs:
      # Traefik kommt wie auf dem Server aus deploy/charts/traefik.
      - arg: --disable=traefik
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: false
